<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon français</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="referrer" content="no-referrer">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap">
<style>
:root{
  --bg:#FFFFFF; --side:#F7F7F5; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B70; --rule:#E8E8EA; --soft:#F2F2F4; --hover:rgba(0,0,0,.055);
  --accent:#2563EB; --accent-ink:#FFFFFF; --focus:#2563EB;
  --good:#1F8A5B; --warn:#B7791F; --bad:#C2362B;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;
  --serif:var(--sans);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161618;--side:#1D1D20;--surface:#1D1D20;--ink:#EDEDEF;--muted:#9A9AA2;--rule:#2E2E33;--soft:#26262B;--hover:rgba(255,255,255,.07);--accent:#6EA0FF;--accent-ink:#0E0E10;--focus:#6EA0FF;--good:#4FBF8B;--warn:#E0A83C;--bad:#FF8F85;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#161618;--side:#1D1D20;--surface:#1D1D20;--ink:#EDEDEF;--muted:#9A9AA2;--rule:#2E2E33;--soft:#26262B;--hover:rgba(255,255,255,.07);--accent:#6EA0FF;--accent-ink:#0E0E10;--focus:#6EA0FF;--good:#4FBF8B;--warn:#E0A83C;--bad:#FF8F85;color-scheme:dark;}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss03'}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;align-self:start;background:var(--side);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:22px 12px 16px;gap:22px}
.brand{font:650 17px/1.2 var(--sans);letter-spacing:-.01em;padding:4px 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.rail .gear{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left;font-size:15px;font-weight:450}
.nav button:hover,.rail .gear:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--hover);font-weight:600}
.nav button[aria-current="page"] svg{color:var(--accent)}
.rail .gear{margin-top:auto;color:var(--muted)}
.rail svg,.tabbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding:44px 48px 96px;max-width:900px;width:100%;margin:0 auto}
h1{font:650 28px/1.15 var(--sans);letter-spacing:-.022em;margin:0 0 6px}
h2{font:600 17px/1.3 var(--sans);letter-spacing:-.01em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.muted{color:var(--muted)}
.fr-lede{font:400 14px/1.3 var(--sans);color:var(--muted);margin:0 0 6px;text-transform:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-size:15px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:32px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=search],select,textarea{width:100%;min-height:38px;padding:7px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:80px;resize:vertical}
select{appearance:auto}
label.f{display:block;font-size:13px;font-weight:550;margin:0 0 5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 220px}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:6px;background:var(--soft);font-size:13px;font-weight:500;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--rule);margin:30px 0}

/* ---------- tense selector (plain, no colour coding) ---------- */
.tb{display:none}
.tbtn{display:inline-flex;align-items:center;min-height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tbtn:hover{background:var(--soft)}
.tbtn[aria-pressed="true"]:hover{background:var(--ink)}

/* ---------- today ---------- */
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c)}
.days{display:flex;align-items:flex-end;gap:5px;height:72px;margin-top:6px}
.days div{flex:1;background:var(--soft);border-radius:3px 3px 0 0;min-height:4px}
.days div.on{background:var(--accent)}
.daylab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.weak{list-style:none;margin:0;padding:0}
.weak li{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.weak li:first-child{border-top:0}
.weak b{font:600 16px/1.2 var(--sans)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px}

/* ---------- words ---------- */
.wtools{display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(190px,1.6fr) minmax(120px,.9fr) minmax(120px,.9fr) auto;gap:8px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:3}
.wcount{color:var(--muted);font-size:13px;margin:4px 0 6px}
.wlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:30px minmax(0,1.2fr) minmax(0,1.4fr) 36px 36px;gap:0 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.wrow.hidden{opacity:.5}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;margin:0 auto}
.dot.learning{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.known{border-color:var(--good);background:var(--good)}
.wfr{font:550 18px/1.3 var(--sans);letter-spacing:-.005em}
.wfr .art{color:var(--muted);font-weight:400}
.wen{font-size:15px}
.wpr{font-size:13px;color:var(--muted)}
.rg{display:inline-block;margin-left:8px;padding:0 7px;border-radius:5px;background:var(--soft);color:var(--muted);font:500 12px/20px var(--sans);vertical-align:3px}
.wxl{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:0 0 2px;color:var(--muted);font-size:14px}
.wxl .gr{font-weight:500;color:var(--ink);background:var(--soft);border-radius:5px;padding:0 7px;font-size:12.5px;line-height:20px}
.wxl .exs{font-style:italic}
.icon-btn.sm{width:28px;height:28px}.icon-btn.sm svg{width:16px;height:16px}
.wedit{grid-column:1/-1;background:var(--side);border:1px solid var(--rule);border-radius:10px;padding:16px;margin:8px 0 6px}
.wedit .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wedit .fields .full{grid-column:1/-1}
.more{margin:18px 0}
mark{background:color-mix(in srgb,var(--accent) 20%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- verbs ---------- */
.vsplit{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
.vlist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto;border-top:1px solid var(--rule)}
.vlist button{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;padding:8px 8px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left}
.vlist button b{font:550 16px/1.3 var(--sans)}
.vlist button span{font-size:13px;color:var(--muted)}
.vlist button:hover{background:var(--soft)}
.vlist button[aria-current="true"]{background:var(--hover)}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:6px}
.vword{font:650 clamp(38px,7vw,54px)/1.05 var(--sans);letter-spacing:-.028em;margin:0}
.vmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 22px}
.tenses{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.ctable{margin-top:10px;border-top:1px solid var(--rule)}
.crow{display:grid;grid-template-columns:80px minmax(0,1fr) 38px;gap:0 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.crow .p{color:var(--muted);font-size:15px}
.crow.wide{grid-template-columns:116px minmax(0,1fr) 38px}
.tex{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.tex .muted{font-size:13px}
.crow .form{font:550 24px/1.2 var(--sans);letter-spacing:-.012em}
.crow .form em{font-style:normal;color:var(--accent)}
.crow .ex{font-size:14px;color:var(--muted);margin-top:2px}
.alltable{width:100%;border-collapse:collapse;margin-top:10px}
.alltable th{font-weight:550;font-size:13px;line-height:1.2;text-align:left;padding:8px 8px;border-bottom:1px solid var(--ink);vertical-align:bottom;color:var(--muted)}
.alltable td{padding:10px 8px;border-bottom:1px solid var(--rule);font:500 16px/1.25 var(--sans)}
.alltable td:first-child{font:400 14px var(--sans);color:var(--muted);white-space:nowrap}
.alltable td button{border:0;background:none;padding:0;font:inherit;text-align:left}
.alltable td button:hover{color:var(--accent)}
.scroll-x{overflow-x:auto}
.backlink{display:none}

/* ---------- review / drill ---------- */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;max-width:620px;margin:18px 0 24px}
.setup .full{grid-column:1/-1}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prog .bar{flex:1;height:5px}
.prog .bar i{background:var(--accent)}
.flash{background:var(--surface);border:1px solid var(--rule);border-radius:14px;min-height:300px;display:grid;place-items:center;padding:36px 28px;text-align:center;cursor:pointer;width:100%;color:var(--ink)}
.flash:hover{border-color:var(--muted)}
.flash .big{font:600 clamp(34px,6vw,50px)/1.15 var(--sans);letter-spacing:-.02em;margin:0}
.flash .en{font:600 clamp(26px,4.5vw,36px)/1.2 var(--sans);letter-spacing:-.015em;margin:0}
.flash .big.dim{font-size:22px;color:var(--muted);font-weight:500}
.flash .en.dim{font-size:20px;color:var(--muted);font-weight:500}
.flash .pr{color:var(--muted);margin-top:10px;font-size:16px}
.flash .hint{color:var(--muted);font-size:14px;margin-top:18px}
.flash .note{margin-top:14px;font-size:15px;max-width:44ch;margin-inline:auto}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;font-weight:600}
.grades button small{font-weight:400;color:var(--muted);font-size:12px}
.grades button:hover{background:var(--soft)}
.q-line{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px;color:var(--muted);font-size:15px}
.qinf{font:650 clamp(34px,6vw,48px)/1.1 var(--sans);letter-spacing:-.025em;margin:0}
.qrow{display:flex;align-items:center;gap:14px;margin:24px 0 14px;max-width:520px}
.qrow .pro{font:400 clamp(22px,4.5vw,28px)/1 var(--sans);color:var(--muted);min-width:2.4ch}
.qrow input{font:500 clamp(22px,4.5vw,28px)/1.1 var(--sans);min-height:54px;padding:6px 14px;border-radius:10px}
.verdict{border-radius:10px;padding:14px 18px;margin:8px 0 16px;max-width:520px;border:1px solid var(--rule);background:var(--surface)}
.verdict.ok{border-color:var(--good)}
.verdict.no{border-color:var(--bad)}
.verdict b{font-size:16px}
.verdict .ans{font:550 24px/1.25 var(--sans);margin:4px 0}
.summary li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--rule)}
.summary{list-style:none;padding:0;margin:12px 0 22px;max-width:520px}
.checks{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- translate ---------- */
.tbox{display:grid;gap:12px;max-width:720px}
.tbox textarea{font:450 22px/1.35 var(--sans);letter-spacing:-.01em;min-height:96px;padding:12px 14px;border-radius:10px}
.swap{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--muted)}
.swap:hover{background:var(--soft);color:var(--ink)}
.swap svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tres{margin-top:26px;max-width:720px}
.tres .out{font:600 clamp(26px,4.5vw,36px)/1.2 var(--sans);letter-spacing:-.018em}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.alts .chip{border:1px solid var(--rule);background:var(--surface);cursor:pointer;min-height:32px;font-size:14px;color:var(--ink)}
.alts .chip:hover{background:var(--soft)}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.links a.btn{text-decoration:none;color:var(--ink)}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.savebar input{flex:1 1 220px}

/* ---------- misc ---------- */
dialog{border:1px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(540px,calc(100vw - 28px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.tabbar{display:none}
.empty{padding:32px 0;color:var(--muted)}

@media (max-width:820px){
  .app{display:block}
  .rail{display:none}
  main{padding:22px 18px 110px}
  h1{font-size:26px}
  .tabbar{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:11px;min-height:48px;border-radius:8px;padding:4px 0}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
  .two{grid-template-columns:1fr;gap:28px}
  .wtools{grid-template-columns:1fr 1fr;position:static}
  .wtools .grow2{grid-column:1/-1}
  .wrow{grid-template-columns:30px minmax(0,1fr) 36px 36px;grid-template-areas:"d fr s e" "d en en en" "d x x x"}
  .wrow .wxl{grid-area:x}
  .wrow .dot{grid-area:d;align-self:start;margin-top:6px}
  .wrow .wfr{grid-area:fr}.wrow .wen{grid-area:en}.wrow .wpr{grid-area:pr}
  .wrow .s{grid-area:s}.wrow .e{grid-area:e}
  .wedit .fields{grid-template-columns:1fr}
  .vsplit{grid-template-columns:minmax(0,1fr);gap:12px}
  .vlist{position:static;max-height:none}
  .vsplit.detail .vcol{display:none}
  .vsplit:not(.detail) .vdetail{display:none}
  .backlink{display:inline-flex;margin-bottom:12px}
  .crow{grid-template-columns:58px minmax(0,1fr) 38px}
  .crow.wide{grid-template-columns:96px minmax(0,1fr) 38px}
  .crow .form{font-size:22px}
  .setup{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Mon français</div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <button class="gear" data-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Settings</button>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).replace(/[\u2019]/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').toLowerCase();
const clean=s=>String(s).trim().toLowerCase().replace(/[\u2018\u2019`´]/g,"'").replace(/\s+/g,' ');
const plural=(n,w)=>`${n.toLocaleString('en')} ${w}${n===1?'':'s'}`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const endOfDay=()=>new Date().setHours(23,59,59,999);
const bullet=t=>'';
const capital=s=>s.charAt(0).toUpperCase()+s.slice(1);
const splitArt=fr=>{const m=fr.match(/^(un |une |le |la |l\u2019|l'|les |des )/);return m?[m[1],fr.slice(m[1].length)]:['',fr]};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function hl(text,q){ // highlight search matches, accent-insensitive
  if(!q) return esc(text);
  const n=norm(text), i=n.indexOf(norm(q));
  if(i<0||n.length!==text.length) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

/* ================= state & persistence ================= */
const blank=()=>({v:1,u:0,p:{},e:{},c:[],log:{},dr:{},set:{rate:.8,voice:'',src:'online',auto:true}});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return blank()}
function migrate(o){const b=blank();o=o&&typeof o==='object'?o:{};return Object.assign(b,o,{set:Object.assign(b.set,o.set||{})})}
let saveT,dbRef=null,_all=null;
function touch(){S.u=Date.now();_all=null;clearTimeout(saveT);saveT=setTimeout(persist,400)}
function persist(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}mirror(j)}
function mirror(j){if(dbRef&&j.length<240000){try{dbRef.set({u:S.u,j}).catch(()=>{})}catch(e){}}}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    dbRef=db.doc('data/users/'+id+'/progress');
    const snap=await dbRef.get();
    if(snap.exists){
      const r=snap.data();
      if(r&&r.j&&r.u>S.u&&!sessionActive()){S=migrate(JSON.parse(r.j));_all=null;try{localStorage.setItem(KEY,r.j)}catch(e){}render()}
      else if(r&&r.u<S.u)mirror(JSON.stringify(S));
    }else if(S.u)mirror(JSON.stringify(S));
  }catch(e){}
}

/* ================= speech ================= */
let voices=[];
function loadVoices(){try{voices=(speechSynthesis.getVoices()||[]).filter(v=>/^fr/i.test(String(v.lang).replace('_','-')))}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',loadVoices)}
let curAudio=null,speakId=0;
const ttsUrl=t=>'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=fr&q='+encodeURIComponent(t);
const ONLINE_FAIL='The online French voice couldn’t load. If you’re viewing this inside claude.ai, open the downloaded file instead.';
function stopAudio(){
  if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
  try{if('speechSynthesis' in window&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel()}catch(e){}
}
function chunk(t){
  if(t.length<=180)return [t];
  const out=[];let cur='';
  for(const p of t.split(/(?<=[.!?;,])\s+/)){
    if(cur&&(cur+' '+p).length>180){out.push(cur);cur=p}else cur=(cur?cur+' ':'')+p;
  }
  if(cur)out.push(cur);return out;
}
/* Device voice: same method as the original page (language only, browser picks the voice). */
function speakDevice(txt){
  if(!('speechSynthesis' in window))return toast('This browser can’t play speech.');
  if(!voices.length)loadVoices();
  if(!voices.length)return toast('This device has no French voice installed. Switch to the online voice in Settings.');
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='fr-FR';u.rate=S.set.rate;
    if(!voices.length)loadVoices();
    const v=S.set.voice&&voices.find(v=>v.voiceURI===S.set.voice);
    if(v){u.voice=v;u.lang=v.lang}
    speechSynthesis.speak(u);
  }catch(e){toast('Speech didn’t start.')}
}
/* Online French voice (default). Falls back to the device voice if it can't load. */
function speak(t){
  const txt=String(t).replace(/[\u2019]/g,"'").trim();if(!txt)return;
  const id=++speakId;stopAudio();
  if(S.set.src==='device'||!window.Audio)return speakDevice(txt);
  const parts=chunk(txt);let i=0,failed=false;
  const next=()=>{
    if(id!==speakId||i>=parts.length)return;
    const a=new Audio(ttsUrl(parts[i]));
    a.preservesPitch=true;a.playbackRate=Math.min(1,S.set.rate+.1);curAudio=a;
    const bad=()=>{
      if(failed||id!==speakId)return;failed=true;
      // Only fall back to a device voice if the device really has a French one.
      if(!voices.length)loadVoices();
      if(voices.length){toast('The online voice isn’t available. Using this device’s French voice.');speakDevice(parts.slice(i).join(' '))}
      else toast(ONLINE_FAIL);
    };
    a.onended=()=>{i++;next()};
    a.onerror=bad;
    try{const p=a.play();if(p&&p.catch)p.catch(bad)}catch(e){bad()}
  };
  next();
}

function streak(){
  let n=0,t=Date.now();
  const has=k=>{const l=S.log[k];return l&&(l.n+l.dn)>0};
  if(!has(dayKey(t)))t-=DAY;
  while(has(dayKey(t))){n++;t-=DAY}
  return n;
}
function weakSpots(){
  return Object.entries(S.dr).map(([k,[r,w]])=>({k,r,w,a:r+w,acc:r/(r+w)})).filter(x=>x.a>=3&&x.acc<.8).sort((a,b)=>a.acc-b.acc||b.a-a.a);
}

function proLabel(t,p,f){
  const vw=/^[aeiouyhéèêàâîôûœ]/i.test(f||'');
  if(t==='subjonctif'){
    if(p==='je')return vw?'que j\u2019':'que je';
    if(p==='il/elle')return 'qu\u2019il/elle';
    if(p==='ils/elles')return 'qu\u2019ils/elles';
    return 'que '+p;
  }
  return p==='je'&&vw?'j\u2019':p;
}
const spoken=(t,p,f)=>{const l=proLabel(t,p,f);return (l.endsWith('\u2019')?l:l.split('/')[0]+' ')+f};

function startReview(){
  const pool=poolFor(RC), now=endOfDay();
  const due=pool.filter(w=>endOfDayDue(w.id)).sort((a,b)=>S.p[a.id][1]-S.p[b.id][1]).slice(0,60);
  const fresh=pool.filter(w=>!S.p[w.id]).sort((a,b)=>a.rk-b.rk).slice(0,RC.newN);
  const q=[...due,...fresh].map(w=>({id:w.id,d:RC.dir==='mix'?(Math.random()<.5?'fr':'en'):RC.dir,fresh:!S.p[w.id],lapsed:false}));

  const mixed=[];while(a.length||b.length){if(a.length)mixed.push(a.shift());if(a.length&&b.length&&Math.random()<.4)mixed.push(b.shift());else if(!a.length&&b.length)mixed.push(b.shift())}
  R={q:mixed,i:0,total:mixed.length,cleared:0,first:0,missed:[],reveal:false,started:true};

}
function nextIntervals(c){
  const p=S.p[c.id]||[0,0,0],b=p[0];
  const lab=n=>{const d=BOX_DAYS[n];return d===1?'1 day':d+' days'};
  return {good:lab(Math.min(6,Math.max(1,b+1))),easy:lab(Math.min(6,Math.max(2,b+2)))};
}
function reviewCard(){

      ${R.reveal?'':`<div class="hint">${c.d==='ear'?'Say it, then tap to check':'Tap or press space to show the answer'}</div>`}</div>
    </div>

    <div class="grades">

      <button data-act="grade" data-g="good" title="Key: 2"><span>Good</span><small>${iv.good}</small></button>
      <button data-act="grade" data-g="easy" title="Key: 3"><span>Easy</span><small>${iv.easy}</small></button>
    </div>`:''}`;
  if(!R.reveal&&S.set.auto&&(c.d==='fr'||c.d==='ear')&&!R.spoken)speakCard(w);

function speakCard(w){R.spoken=true;speak(w.fr)}
function flip(){if(!R||!R.started)return;R.reveal=true;R.spoken=false;reviewCard()}
function grade(g){
  const c=R.q[R.i],p=S.p[c.id]||[0,0,0];let box=p[0];
  if(g==='again')box=0;else if(g==='good')box=Math.min(6,Math.max(1,box+1));else box=Math.min(6,Math.max(2,box+2));
  S.p[c.id]=[box,g==='again'?Date.now():Date.now()+BOX_DAYS[box]*DAY,p[2]+1];

/* ================= DRILL (conjugation) ================= */
const DC={set:'all',tenses:['présent'],n:10,accents:false,verb:null};
function isReg(v){return v.grp==='1'||v.grp==='2'||/^regular/.test(v.note)}
function variants(f){
  const m=f.match(/\(([^)]*)\)/);if(!m)return [f];
  const pre=f.slice(0,m.index),rest=variants(f.slice(m.index+m[0].length)),out=[];
  for(const o of ['',m[1]])for(const r of rest)out.push(pre+o+r);return out;
}
function stripPron(s){return s.replace(/^(que |qu')?(j'|je |tu |il\/elle |ils\/elles |ils |elles |il |elle |on |nous |vous )\s*/,'')}
function checkAnswer(input,form,ignoreAcc,refl,alt){
  let a=stripPron(clean(input));
  const f=x=>ignoreAcc?norm(x):x;
  let base=[...variants(clean(form)),clean(form)];
  if(alt)base=base.concat(variants(clean(alt)));
  if(refl)base=base.concat(base.map(x=>x.replace(/^(me |te |se |nous |vous |m'|t'|s')/,'')));
  // modern (1990) spelling drops the circumflex on i and u: parait, paraitrai
  base=base.concat(base.map(x=>x.replace(/î/g,'i').replace(/û/g,'u')));
  const ok=base.map(f);
  if(ok.includes(f(a)))return 'ok';
  if(!ignoreAcc&&ok.map(norm).includes(norm(a)))return 'accent';
  return 'no';
}
function genDrill(){
  const weak=new Set(weakSpots().map(x=>x.k));
  let combos=[];
  for(const v of DATA.verbs){
    if(DC.set==='regular'&&!isReg(v))continue;
    if(DC.set==='irregular'&&isReg(v))continue;
    if(DC.set==='one'&&v.inf!==DC.verb)continue;
    for(const t of DC.tenses){
      if(!v.f[t])continue;
      if(DC.set==='weak'&&!weak.has(v.inf+'|'+t))continue;
      for(const p of PRON)if(v.f[t][p])combos.push({inf:v.inf,t,p});
    }
  }
  return shuffle(combos).slice(0,DC.n);
}
function vDrill(){
  if(VP.verb){DC.set='one';DC.verb=VP.verb;VP={};}
  else if(VP.preset==='weak'){DC.set='weak';VP={};DC.tenses=[...TENSES]}
  if(DR&&DR.phase==='done')return drillDone();
  if(DR&&DR.phase&&DR.phase!=='setup')return drillQ();
  const cats=[['all','All verbs'],['regular','Regular verbs'],['irregular','Irregular verbs'],['weak','My weak spots']];
  if(DC.set==='one'&&DC.verb)cats.push(['one','Just '+DC.verb]);
  $('#view').innerHTML=`
    <h1>Drill</h1>
    <p class="sub">You’re given a verb, a tense and a pronoun. Type the form.</p>
    <div class="setup">
      <div class="full"><label class="f" for="ds">Which verbs</label><select id="ds">${cats.map(([v,l])=>`<option value="${v}" ${DC.set===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="full"><div class="f" id="dtl">Tenses</div><div class="checks" role="group" aria-labelledby="dtl">${TENSES.map(t=>`<button class="tbtn" data-act="drill-tense" data-t="${esc(t)}" aria-pressed="${DC.tenses.includes(t)}">${bullet(t)}${esc(t)}</button>`).join('')}</div></div>
      <div><label class="f" for="dn">Questions</label><select id="dn">${[10,20,40].map(n=>`<option ${DC.n===n?'selected':''}>${n}</option>`).join('')}</select></div>
      <div><label class="f" for="da">Accents</label><select id="da"><option value="strict" ${!DC.accents?'selected':''}>Must be correct</option><option value="loose" ${DC.accents?'selected':''}>Ignore accents</option></select></div>
    </div>
    <button class="btn primary" data-act="start-drill">Start</button>`;
  $('#ds').addEventListener('change',e=>{DC.set=e.target.value});
  $('#dn').addEventListener('change',e=>{DC.n=+e.target.value});
  $('#da').addEventListener('change',e=>{DC.accents=e.target.value==='loose'});
}
function startDrill(){
  if(!DC.tenses.length)return toast('Pick at least one tense.');
  const q=genDrill();
  if(!q.length){toast(DC.set==='weak'?'No weak spots yet. Drill some verbs first.':'No questions match those choices.');return}
  DR={q,i:0,res:[],phase:'q'};vDrill();
}
function drillQ(){
  const x=DR.q[DR.i],v=DATA.verbs.find(v=>v.inf===x.inf),[form,ex]=v.f[x.t][x.p];
  const pro=proLabel(x.t,x.p,form);
  const r=DR.last;
  $('#view').innerHTML=`
    <div class="prog"><div class="bar"><i style="width:${DR.i/DR.q.length*100}%"></i></div><span class="muted">${DR.i+(DR.phase==='a'?1:0)} of ${DR.q.length}</span></div>
    <div class="q-line">${bullet(x.t)}<span class="muted" style="font-size:15px">${esc(x.t)}</span></div>
    <p class="qinf">${esc(x.inf)}</p><div class="muted">${esc(v.en)}</div>
    <div class="qrow"><span class="pro">${esc(pro)}</span><label class="sr" for="ans">Your answer</label><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${DR.phase==='a'?'disabled':''} value="${esc(DR.phase==='a'?DR.typed:'')}"></div>
    ${DR.phase==='a'?`<div class="verdict ${r==='ok'?'ok':'no'}"><b>${r==='ok'?'Correct':r==='accent'?'Check the accents':'Not quite'}</b>
      ${r==='ok'?'':`<div class="ans">${esc(pro+(pro.endsWith('\u2019')?'':' ')+form)}</div>`}
      ${ex?`<div class="muted">${esc(ex)}</div>`:(v.x&&v.x[x.t]?`<div class="muted">${esc(v.x[x.t])}</div>`:'')}</div>
      <div class="row"><button class="btn primary" id="nextq" data-act="next-q">${DR.i+1>=DR.q.length?'See results':'Next'}</button><button class="btn" data-act="say-text" data-t="${esc(spoken(x.t,x.p,form))}">${svg('say')} Play</button></div>`
    :`<button class="btn primary" data-act="check-q">Check</button> <button class="btn" data-act="skip-q">I don’t know</button>`}`;
  const inp=$('#ans');
  if(DR.phase==='q'){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkQ()}})}
  else $('#nextq').focus();
}
function checkQ(skip){
  const x=DR.q[DR.i],v=DATA.verbs.find(v=>v.inf===x.inf),form=v.f[x.t][x.p][0];
  const typed=skip?'':$('#ans').value;
  if(!skip&&!typed.trim())return toast('Type an answer first, or choose “I don’t know”.');
  const alt=(v.alt&&v.alt[x.t]&&v.alt[x.t][x.p])||'';
  const r=skip?'no':checkAnswer(typed,form,DC.accents,v.refl,alt);
  const ok=r==='ok',k=x.inf+'|'+x.t,cur=S.dr[k]||[0,0];
  S.dr[k]=[cur[0]+(ok?1:0),cur[1]+(ok?0:1)];
  bumpLog('dn',ok);touch();
  DR.res.push({x,form,typed,r});DR.last=r;DR.typed=typed;DR.phase='a';
  drillQ();
}
function nextQ(){
  DR.i++;DR.phase='q';DR.last=null;
  if(DR.i>=DR.q.length){DR.phase='done';return drillDone()}
  drillQ();
}
function drillDone(){
  const ok=DR.res.filter(r=>r.r==='ok').length,miss=DR.res.filter(r=>r.r!=='ok');
  $('#view').innerHTML=`
    <h1>${ok} of ${DR.res.length} right</h1>
    <p class="sub">${ok===DR.res.length?'A clean run.':miss.length+' to go back over.'}</p>
    ${miss.length?`<ul class="summary">${miss.map(m=>`<li><span>${bullet(m.x.t)} <span style="font-weight:550">${esc(m.x.inf)}</span> <span class="muted">${esc(m.x.p)}</span></span><span style="font-weight:550">${esc(m.form)}</span></li>`).join('')}</ul>`:''}
    <div class="row"><button class="btn primary" data-act="start-drill">Another round</button>${miss.length?`<button class="btn" data-act="retry-missed">Retry the misses</button>`:''}<button class="btn" data-act="drill-setup">Change settings</button></div>`;
}

}
function vTranslate(){
  const en=TV.dir==='enfr';
  $('#view').innerHTML=`
    <h1>Translate</h1>
    <p class="sub">Look up a word or phrase, then save it. Saved phrases show up in Words and Review.</p>
    <div class="tbox">
      <div class="row"><span class="chip">${en?'English':'French'}</span><button class="swap" data-act="swap" aria-label="Swap languages">${svg('swap')}</button><span class="chip">${en?'French':'English'}</span></div>
      <label class="sr" for="tin">Text to translate</label>
      <textarea id="tin" rows="3" maxlength="300" lang="${en?'en':'fr'}" placeholder="${en?'Type a word or phrase in English':'Tapez un mot ou une phrase en français'}">${esc(TV.text)}</textarea>
      <div class="row"><button class="btn primary" data-act="do-translate">Translate</button><span class="muted" style="font-size:14px">Press Enter to translate</span></div>
    </div>
    <div id="tres"></div>
    <hr class="rule">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0" id="tcount"></h2><div style="width:min(300px,100%)"><label class="sr" for="tq">Search saved</label><input id="tq" type="search" placeholder="Search saved" value="${esc(TV.q)}" autocomplete="off"></div></div>
    <div id="tlist"></div>`;
  const inp=$('#tin');
  inp.addEventListener('input',e=>{TV.text=e.target.value});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doTranslate()}});
  $('#tq').addEventListener('input',e=>{TV.q=e.target.value;drawSaved()});
  drawResult();drawSaved();
}
function drawResult(){
  const el=$('#tres');if(!el)return;
  const links=TV.text.trim()?`<div class="links"><span class="muted" style="font-size:14px">Compare in</span>${linkOuts().map(([n,u])=>`<a class="btn small" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>`:'';
  if(TV.busy){el.innerHTML='<p class="muted" style="margin-top:22px">Translating…</p>';return}
  if(TV.err){el.innerHTML=`<div class="verdict no" style="margin-top:22px"><b>${esc(TV.err)}</b></div>${links}`;return}
  if(!TV.res){el.innerHTML='';return}
  const r=TV.res,enfr=TV.dir==='enfr',frText=enfr?r.out:r.src;
  el.innerHTML=`<div class="tres">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div class="out" lang="${enfr?'fr':'en'}" style="flex:1">${esc(r.out)}</div><button class="icon-btn" data-act="say-text" data-t="${esc(frText)}" aria-label="Play the French">${svg('say')}</button></div>
    ${r.alts.length?`<div class="alts" role="group" aria-label="Other translations">${r.alts.map((a,i)=>`<button class="chip" data-act="use-alt" data-i="${i}">${esc(a)}</button>`).join('')}</div>`:''}
    <div class="savebar"><label class="sr" for="tnote">Note</label><input id="tnote" type="text" placeholder="Add a note (optional)" autocomplete="off"><button class="btn primary" data-act="save-phrase">Save</button></div>
    ${links}</div>`;
}
async function doTranslate(){
  const text=TV.text.trim();
  if(!text)return toast('Type a word or phrase first.');
  if(new TextEncoder().encode(text).length>500)return toast('That’s too long for the free service. Try a shorter phrase.');
  const [from,to]=TV.dir==='enfr'?['en','fr']:['fr','en'];
  TV.busy=true;TV.err='';TV.res=null;drawResult();
  try{
    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to+(S.set.email?'&de='+encodeURIComponent(S.set.email):'');
    const r=await fetch(url),j=await r.json();
    let out=decodeHTML((j.responseData&&j.responseData.translatedText)||'').trim();
    if(/MYMEMORY WARNING/i.test(out)||+j.responseStatus===429){TV.err='The free daily limit is used up. Try the links below, or add your email in Settings to raise it.'}
    else if(+j.responseStatus!==200||!out){TV.err='No translation came back. Try different wording, or use the links below.'}
    else{
      const fix=t=>to==='fr'?t.replace(/'/g,'\u2019'):t;
      out=fix(out);
      const seen=new Set([norm(out)]),alts=[];
      for(const m of (j.matches||[])){const t=fix(decodeHTML(m.translation||'').trim());if(t&&!seen.has(norm(t))&&!/MYMEMORY WARNING/i.test(t)){seen.add(norm(t));alts.push(t)}if(alts.length>=4)break}
      TV.res={src:text,out,alts};
    }
  }catch(e){TV.err='Couldn’t reach the translation service. Check your connection, or use the links below.'}
  TV.busy=false;drawResult();
}
function savePhrase(){
  const r=TV.res;if(!r)return;
  const enfr=TV.dir==='enfr',fr=(enfr?r.out:r.src).trim(),en=(enfr?r.src:r.out).trim(),note=(($('#tnote')||{}).value||'').trim();
  if(allWords().some(w=>w.custom&&norm(w.fr)===norm(fr)&&norm(w.en)===norm(en)))return toast('Already saved.');
  S.c.push({id:'c'+Date.now().toString(36),fr,en,pr:'',note,t:Date.now()});
  touch();drawSaved();toast('Saved. It’s now in Words and Review.');
}
function drawSaved(){
  const q=norm(TV.q.trim()),all=allWords().filter(w=>w.custom).sort((a,b)=>(b.t||0)-(a.t||0));
  const list=all.filter(w=>!q||norm(w.fr).includes(q)||norm(w.en).includes(q)||norm(w.note||'').includes(q));
  const c=$('#tcount');if(c)c.textContent='Saved ('+all.length+')';
  const el=$('#tlist');if(!el)return;
  el.innerHTML=list.length?`<ul class="wlist">${list.map(w=>rowHTML(w,TV.q.trim())).join('')}</ul>`:`<p class="empty">${all.length?'Nothing matches that search.':'Nothing saved yet. Translate something and choose Save.'}</p>`;
}

/* ================= settings & backup ================= */
function testOnline(){
  const el=$('#vstat');if(!el)return;
  if(S.set.src==='device'){el.textContent='';return}
  el.textContent='Checking the online voice…';let done=false;
  const fin=m=>{if(!done){done=true;if($('#vstat'))$('#vstat').textContent=m}};
  try{
    const a=new Audio(ttsUrl('Bonjour'));a.volume=0;
    a.onplaying=()=>{fin('The online French voice works.');try{a.pause()}catch(e){}};
    a.onerror=()=>fin('The online voice couldn’t load (error '+(a.error?a.error.code:'unknown')+'). '+(location.protocol==='file:'||/claude/.test(location.hostname)?'If this is the claude.ai preview, open the downloaded file instead.':'Check your connection.'));
    const p=a.play();if(p&&p.catch)p.catch(()=>fin('The online voice couldn’t play. If this is the claude.ai preview, open the downloaded file instead.'));
  }catch(e){fin('The online voice couldn’t start.')}
}
function openSettings(){
  loadVoices();
  const d=$('#dlg');
  d.innerHTML=`
    <h2>Settings and backup</h2>
    <div class="setup" style="margin:0 0 8px;max-width:none">
      <div class="full"><label class="f" for="ss">French voice</label><select id="ss"><option value="online" ${S.set.src!=='device'?'selected':''}>Online French voice (needs internet)</option><option value="device" ${S.set.src==='device'?'selected':''}>This device’s voice</option></select>
        <div class="muted" style="font-size:14px;margin-top:4px">The online voice is a real French voice and doesn’t depend on what’s installed on your device. If it can’t load, the app uses the device voice.</div></div>
      <div class="full"><label class="f" for="sv">Device voice</label><select id="sv"><option value="">Automatic (your browser picks)</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${S.set.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>
        <div class="muted" style="font-size:14px;margin-top:4px">${voices.length?`${voices.length} French voice${voices.length===1?'':'s'} found on this device. If the French sounds English, pick a different one here.`:'No French voices were found on this device. If French sounds English, add a French voice in your system’s speech settings (iPhone: Accessibility, Spoken Content, Voices. Android: Text-to-speech output. Windows: Time and language, Speech).'}</div></div>
      <div><label class="f" for="sr">Speed</label><input id="sr" type="range" min="0.5" max="1.1" step="0.05" value="${S.set.rate}" style="width:100%"></div>
      <div style="align-self:end"><button class="btn small" data-act="test-voice">${svg('say')} Test voice</button></div>
      <div class="full" id="vstat" role="status" style="font-size:14px"></div>
      <div class="full"><label class="f" for="se">Email for translation (optional)</label><input id="se" type="text" inputmode="email" value="${esc(S.set.email||'')}" placeholder="you@example.com" autocomplete="off"><div class="muted" style="font-size:14px;margin-top:4px">Sent to the free MyMemory translation service. It raises the daily limit from 5,000 to 50,000 characters.</div></div>
      <div class="full"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="sa" ${S.set.auto?'checked':''}> Play French automatically in Review</label></div>
    </div>
    <hr class="rule" style="margin:18px 0">
    <h2 style="font-size:17px">Backup</h2>
    <p class="muted" style="margin-top:0;font-size:15px">Your progress is saved in this browser and kept in sync with your account where available. A backup file protects against clearing browser data.</p>
    <div class="row"><button class="btn small" data-act="backup-save">Save backup file</button><button class="btn small" data-act="backup-copy">Copy backup text</button></div>
    <label class="f" for="bt" style="margin-top:14px">Restore from backup text</label>
    <textarea id="bt" placeholder="Paste backup text here"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="backup-restore">Restore</button><button class="btn small danger" data-act="reset-all">Erase all progress</button></div>
    <div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn primary" data-act="close-dlg">Done</button></div>`;
  d.showModal();
  $('#sr').addEventListener('input',e=>{S.set.rate=+e.target.value;touch()});
  $('#sv').addEventListener('change',e=>{S.set.voice=e.target.value;touch()});
  $('#ss').addEventListener('change',e=>{S.set.src=e.target.value;touch()});
  $('#sa').addEventListener('change',e=>{S.set.auto=e.target.checked;touch()});
  $('#se').addEventListener('change',e=>{S.set.email=e.target.value.trim();touch()});
}
function downloadFile(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function backupSave(){
  const json=JSON.stringify(S,null,1);
  if(!(window.claude&&claude.use)){downloadFile('mon-francais-backup-'+dayKey()+'.json',json);return toast('Backup downloaded.')}
  try{
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:'mon-francais-backup-'+dayKey()+'.json',data:json});return toast('Backup saved.')}
  }catch(e){if(e&&e.code)return toast('Backup wasn’t saved.')}
  backupCopy();
}
async function backupCopy(){
  const json=JSON.stringify(S);
  try{await navigator.clipboard.writeText(json);toast('Backup copied. Paste it somewhere safe.')}
  catch(e){const t=$('#bt');if(t){t.value=json;t.select();toast('Select all and copy the text in the box.')}}
}
function backupRestore(){
  const t=$('#bt').value.trim();if(!t)return toast('Paste your backup text first.');
  try{const o=JSON.parse(t);if(!o||typeof o!=='object'||!o.p)throw 0;S=migrate(o);touch();persist();$('#dlg').close();render();toast('Backup restored.')}
  catch(e){toast('That doesn’t look like a backup.')}
}

/* ================= events ================= */
document.addEventListener('click',async ev=>{
  const g=ev.target.closest('[data-go]');
  if(g){return go(g.dataset.go)}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, row=el.closest('.wrow'), id=row&&row.dataset.id;
  switch(a){
    case 'settings':openSettings();break;
    case 'close-dlg':$('#dlg').close();break;
    case 'test-voice':speak('Bonjour, comment allez-vous ?');testOnline();break;
    case 'backup-save':backupSave();break;
    case 'backup-copy':backupCopy();break;
    case 'backup-restore':backupRestore();break;
    case 'reset-all':
      if(el.dataset.sure){S=blank();_all=null;persist();$('#dlg').close();render();toast('Progress erased.')}
      else{el.dataset.sure=1;el.textContent='Tap again to erase everything'}break;
    case 'start-today':{
      go('review',{autostart:true});break}
    case 'drill-weak':go('drill',{preset:'weak'});break;
    case 'say':{const w=wordById(id);if(w)speak(w.fr);break}
    case 'say-text':speak(el.dataset.t);break;
    case 'cycle':{const next={new:'learning',learning:'known',known:'new'}[status(id)];setStatus(id,next);refreshList();break}
    case 'edit':WV.edit=WV.edit===id?null:id;refreshList();if(WV.edit)setTimeout(()=>{const f=$('#ef');f&&f.focus()},0);break;
    case 'add-word':WV.edit='__new__';refreshList();setTimeout(()=>{const f=$('#ef');f&&f.focus()},0);break;
    case 'cancel-edit':WV.edit=null;refreshList();break;
    case 'save-word':saveWord(el.dataset.new==='1');break;
    case 'toggle-hide':{const e=S.e[WV.edit]||(S.e[WV.edit]={});if(e.hide)delete e.hide;else e.hide=true;if(!Object.keys(e).length)delete S.e[WV.edit];WV.edit=null;touch();refreshList();break}
    case 'reset-word':delete S.e[WV.edit];WV.edit=null;touch();refreshList();toast('Back to the original.');break;
    case 'delete-word':S.c=S.c.filter(c=>c.id!==WV.edit);delete S.e[WV.edit];delete S.p[WV.edit];WV.edit=null;touch();refreshList();break;
    case 'more':WV.shown+=80;refreshList();break;
    case 'to-verb':go('verbs',{verb:el.dataset.inf});break;
    case 'pick-verb':VB.sel=el.dataset.inf;VB.list=false;vVerbs();window.scrollTo(0,0);break;
    case 'verb-list':VB.list=true;vVerbs();break;
    case 'tense':VB.tense=el.dataset.t;drawVerb(DATA.verbs.find(v=>v.inf===VB.sel));break;
    case 'mode':VB.mode=el.dataset.m;drawVerb(DATA.verbs.find(v=>v.inf===VB.sel));break;
    case 'drill-verb':go('drill',{verb:el.dataset.inf});break;
    case 'verb-word':WVS.words.q=el.dataset.inf;WVS.words.cat='all';WVS.words.st='all';WVS.words.shown=80;go('words');break;
    case 'start-review':startReview();break;
    case 'review-again':R=null;vReview();break;
    case 'flip':if(!R.reveal)flip();break;
    case 'say-card':{const w=wordById(R.q[R.i].id);if(w)speak(w.fr);break}
    case 'say-card-ex':{const w=wordById(R.q[R.i].id);if(w&&w.ex)speak(w.ex);break}
    case 'say-ex':{const w=wordById(id);if(w&&w.ex)speak(w.ex);break}
    case 'grade':grade(el.dataset.g);break;
    case 'drill-tense':{const t=el.dataset.t,i=DC.tenses.indexOf(t);i>=0?DC.tenses.splice(i,1):DC.tenses.push(t);el.setAttribute('aria-pressed',i<0);break}
    case 'start-drill':DR=null;startDrill();break;
    case 'drill-setup':DR=null;vDrill();break;
    case 'check-q':checkQ();break;
    case 'skip-q':checkQ(true);break;
    case 'next-q':nextQ();break;
    case 'swap':{TV.dir=TV.dir==='enfr'?'fren':'enfr';TV.res=null;TV.err='';vTranslate();break}
    case 'do-translate':doTranslate();break;
    case 'use-alt':{const r=TV.res;if(r){const i=+el.dataset.i,a=r.alts[i];r.alts[i]=r.out;r.out=a;drawResult()}break}
    case 'save-phrase':savePhrase();break;
    case 'retry-missed':{const m=DR.res.filter(r=>r.r!=='ok').map(r=>r.x);DR={q:m,i:0,res:[],phase:'q'};drillQ();break}
  }
});
document.addEventListener('keydown',e=>{
  if($('#dlg').open||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(view==='review'&&R&&R.started&&tag!=='input'&&tag!=='select'){
    if(!R.reveal&&(e.key===' '||e.key==='Enter')&&tag!=='button'){e.preventDefault();flip()}
    else if(R.reveal&&['1','2','3'].includes(e.key)){grade(['again','good','easy'][+e.key-1])}
  }
});

/* ================= boot ================= */
render();
initDb();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
